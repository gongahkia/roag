[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kenjaku"
version = "0.1.0"
description = "Reproducible riichi mahjong AI research agent and analysis toolkit."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
  { name = "gongahkia" }
]
dependencies = [
  "torch",
]

[project.optional-dependencies]
dev = [
  "ruff",
]

[project.scripts]
kenjaku = "kenjaku.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
