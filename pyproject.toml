[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kenjaku"
version = "0.2.0"
description = "Reproducible riichi mahjong AI research agent and analysis toolkit."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [
  { name = "gongahkia" }
]
dependencies = [
]

[project.optional-dependencies]
ml = [
  "torch",
]
dev = [
  "build",
  "coverage[toml]",
  "pre-commit",
  "pyright",
  "ruff",
  "twine",
]
dev-ml = [
  "build",
  "coverage[toml]",
  "pre-commit",
  "pyright",
  "ruff",
  "torch",
  "twine",
]

[project.scripts]
kenjaku = "kenjaku.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["kenjaku"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.11"
include = ["src", "tests"]
exclude = ["build", "dist", "**/__pycache__"]
strict = ["src/kenjaku/core", "src/kenjaku/io", "src/kenjaku/models"]
reportMissingTypeStubs = "none"
reportPrivateUsage = "none"
reportUnknownArgumentType = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnusedFunction = "none"
executionEnvironments = [
  { root = "src", extraPaths = ["src"] },
  { root = "tests", extraPaths = ["src"] },
]
