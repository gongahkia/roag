[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kenjaku"
version = "0.1.0"
description = "Reproducible riichi mahjong AI research agent and analysis toolkit."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [
  { name = "gongahkia" }
]
dependencies = [
]

[project.optional-dependencies]
ml = [
  "torch",
]
dev = [
  "build",
  "coverage[toml]",
  "ruff",
  "torch",
  "twine",
]

[project.scripts]
kenjaku = "kenjaku.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["kenjaku"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
