# Applied automatically by tools/docker-compose.sh when running inside WSLg.
# It deliberately stays separate from compose.yaml so ordinary Linux/X11 hosts
# never need WSL-specific device and library paths.
x-wslg: &wslg
  environment:
    XDG_RUNTIME_DIR: /mnt/wslg/runtime-dir
    WAYLAND_DISPLAY: "${WAYLAND_DISPLAY:-wayland-0}"
    PULSE_SERVER: "${PULSE_SERVER:-unix:/mnt/wslg/PulseServer}"
    LD_LIBRARY_PATH: /usr/lib/wsl/lib
  volumes:
    - /mnt/wslg:/mnt/wslg:ro
    - /usr/lib/wsl/lib:/usr/lib/wsl/lib:ro
  devices:
    - /dev/dxg:/dev/dxg

services:
  game:
    <<: *wslg
  studio:
    <<: *wslg
  generation-inspector:
    <<: *wslg
  room-editor:
    <<: *wslg
  graphics-doctor:
    <<: *wslg
