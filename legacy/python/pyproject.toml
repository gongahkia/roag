[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regolith-colony"
version = "0.2.0"
description = "A cellular-automata moon colony for your terminal."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
regolith = "regolith.__main__:main"

[tool.setuptools.packages.find]
include = ["regolith*"]
