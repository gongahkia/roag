name: roag

x-roag: &roag
  build:
    context: .
  working_dir: /workspace
  user: "${ROAG_UID:-1000}:${ROAG_GID:-1000}"
  volumes:
    - .:/workspace

x-graphical: &graphical
  <<: *roag
  environment:
    DISPLAY: "${DISPLAY:-}"
    # The generic X11 path does not mount the host runtime directory.  WSLg
    # replaces this with its mounted runtime in compose.wslg.yaml.
    XDG_RUNTIME_DIR: "${ROAG_XDG_RUNTIME_DIR:-/tmp}"
    # A deterministic software path is more reliable than attempting to share
    # a host-specific GPU driver ABI with this small Alpine image.  ROAG is a
    # 2D game; callers can override these variables to investigate hardware
    # acceleration on a compatible host.
    LIBGL_ALWAYS_SOFTWARE: "${ROAG_LIBGL_ALWAYS_SOFTWARE:-1}"
    GALLIUM_DRIVER: "${ROAG_GALLIUM_DRIVER:-llvmpipe}"
    MESA_LOADER_DRIVER_OVERRIDE: "${ROAG_MESA_LOADER_DRIVER_OVERRIDE:-llvmpipe}"
    # Docker has no dependable audio-device contract.  Null OpenAL avoids a
    # non-fatal but alarming device error; the host game path remains free to
    # provide audio later.
    ALSOFT_DRIVERS: "${ROAG_ALSOFT_DRIVERS:-null}"
  volumes:
    - .:/workspace
    # WSLg and Linux X11 expose this socket when graphical forwarding is set up.
    - /tmp/.X11-unix:/tmp/.X11-unix
  stdin_open: true
  tty: true

services:
  test:
    <<: *roag
    command: ["luajit", "tests/run.lua"]

  shell:
    <<: *roag
    entrypoint: ["/bin/bash"]
    stdin_open: true
    tty: true

  package:
    <<: *roag
    command: ["sh", "tools/package_love.sh"]

  debug:
    <<: *roag
    entrypoint: ["sh", "tools/roag_debug.sh"]
    command: ["help"]

  graphics-doctor:
    <<: *graphical
    entrypoint: ["sh", "tools/graphics_doctor.sh"]

  game:
    <<: *graphical
    command: ["love", "."]
    volumes:
      - .:/workspace
      - roag_love_data:/home/roag/.local/share/love
      # WSLg and Linux X11 expose this socket when graphical forwarding is set up.
      - /tmp/.X11-unix:/tmp/.X11-unix

  studio:
    <<: *graphical
    command: ["love", "studio"]

  generation-inspector:
    <<: *graphical
    command: ["love", "level_editor"]

  room-editor:
    <<: *graphical
    command: ["love", "level_editor", "--room-editor"]

volumes:
  roag_love_data:
