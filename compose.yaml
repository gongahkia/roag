name: roag

x-roag: &roag
  build:
    context: .
  working_dir: /workspace
  user: "${ROAG_UID:-1000}:${ROAG_GID:-1000}"
  volumes:
    - .:/workspace

x-graphical: &graphical
  <<: *roag
  environment:
    DISPLAY: "${DISPLAY:-}"
    XDG_RUNTIME_DIR: "${XDG_RUNTIME_DIR:-/tmp}"
  volumes:
    - .:/workspace
    # WSLg and Linux X11 expose this socket when graphical forwarding is set up.
    - /tmp/.X11-unix:/tmp/.X11-unix
  stdin_open: true
  tty: true

services:
  test:
    <<: *roag
    command: ["luajit", "tests/run.lua"]

  shell:
    <<: *roag
    entrypoint: ["/bin/bash"]
    stdin_open: true
    tty: true

  package:
    <<: *roag
    command: ["sh", "tools/package_love.sh"]

  debug:
    <<: *roag
    entrypoint: ["sh", "tools/roag_debug.sh"]
    command: ["help"]

  game:
    <<: *graphical
    command: ["love", "."]
    volumes:
      - .:/workspace
      - roag_love_data:/home/roag/.local/share/love
      # WSLg and Linux X11 expose this socket when graphical forwarding is set up.
      - /tmp/.X11-unix:/tmp/.X11-unix

  studio:
    <<: *graphical
    command: ["love", "studio"]

  sprite-editor:
    <<: *graphical
    command: ["love", "sprite_editor"]

  generation-inspector:
    <<: *graphical
    command: ["love", "level_editor"]

  room-editor:
    <<: *graphical
    command: ["love", "level_editor", "--room-editor"]

volumes:
  roag_love_data:
