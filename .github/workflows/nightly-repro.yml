name: Nightly Reproducibility

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  fixture-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e "."
      - name: Run fixture demo
        run: kenjaku demo --output-dir runs/demo
      - name: Compare golden JSON
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          golden_dir = Path("tests/golden/demo")
          generated_dir = Path("runs/demo")
          golden_names = sorted(path.name for path in golden_dir.glob("*.json"))
          generated_names = sorted(path.name for path in generated_dir.glob("*.json"))
          if golden_names != generated_names:
              print("golden JSON set differs from generated JSON set")
              print(f"golden: {golden_names}")
              print(f"generated: {generated_names}")
              sys.exit(1)
          mismatches = [
              name
              for name in golden_names
              if (golden_dir / name).read_bytes() != (generated_dir / name).read_bytes()
          ]
          if mismatches:
              print(f"demo JSON differed from goldens: {mismatches}")
              sys.exit(1)
          print(f"matched {len(golden_names)} demo JSON files")
          PY
