name: Vagabonds RPG and artwork checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.402'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore Vagabonds.sln --locked-mode
      - run: dotnet build Vagabonds.sln --configuration Release --no-restore
      - run: dotnet test Vagabonds.sln --configuration Release --no-build
      - name: Replay declarative game scenarios and save continuation
        run: dotnet run --project src/Vagabonds.Tools --configuration Release --no-build -- scenario suite devtools/scenarios --output artifacts/scenarios.json
      - name: Check durable agent workflows
        if: matrix.os == 'ubuntu-latest'
        run: python3 -m unittest discover -s tests/agent -v
      - name: Exercise generated companions construction trade and fixed simulation
        run: dotnet run --project src/Vagabonds.Client --configuration Release --no-build -- --world-headless
      - name: Validate finite world macro geography
        run: dotnet run --project src/Vagabonds.Client --configuration Release --no-build -- --validate-worlds 1000 --seed -500
      - name: Report all procedural town and dungeon footprints
        run: dotnet run --project src/Vagabonds.Client --configuration Release --no-build -- --world-report
      - name: Complete the actual RPG quest without graphics
        run: dotnet run --project src/Vagabonds.Client --configuration Release --no-build -- --headless
      - name: Validate procedural quest routes
        run: dotnet run --project src/Vagabonds.Client --configuration Release --no-build -- --validate-seeds 256 --seed -128
      - name: Check catalog freshness and original artwork hashes
        if: matrix.os == 'ubuntu-latest'
        run: python3 tools/build_game_catalog.py --check
      - name: Check generic metadata and exports
        if: matrix.os == 'ubuntu-latest'
        run: python3 -m unittest discover -s tests/catalog -v
      - name: Check offline atlas interactions and downloads
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 -m venv artifacts/atlas-browser
          artifacts/atlas-browser/bin/python -m pip install playwright==1.64.0
          artifacts/atlas-browser/bin/python -m playwright install --with-deps chromium
          artifacts/atlas-browser/bin/python tools/verify_asset_atlas.py
