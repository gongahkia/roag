name: Ithica build and campaign checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.402'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore Ithica.sln --locked-mode
      - run: dotnet build Ithica.sln --configuration Release --no-restore
      - run: dotnet test Ithica.sln --configuration Release --no-build
      - name: Run legacy colony regression
        run: dotnet run --project src/Ithica.Tools --configuration Release --no-build -- --legacy-colony --headless 700 --demo --seed 42
      - name: Complete integrated rescue salvage construction loop
        run: dotnet run --project src/Ithica.Tools --configuration Release --no-build -- --headless
      - name: Complete RPG expedition without graphics
        run: dotnet run --project src/Ithica.Client --configuration Release --no-build -- --preview --headless
      - name: Validate procedural quest routes across seeds
        run: dotnet run --project src/Ithica.Tools --configuration Release --no-build -- --validate-seeds 256 --seed -128
      - name: Check generated catalog and original image hashes
        if: matrix.os == 'ubuntu-latest'
        run: python3 tools/build_game_catalog.py --check
