name: Classic roguelike and artwork
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install desktop game and test tools
        run: sudo apt-get update && sudo apt-get install -y love luajit xvfb xauth
      - name: Check catalogue export and original artwork
        run: make assets-check catalog-test preservation
      - name: Run turn-based gameplay regressions
        run: make test
      - name: Exercise the actual game and continuing save
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a make gui
      - name: Package only the Lua game and current artwork
        run: make package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classic-roag
          path: |
            dist/roag.love
            artifacts/classic-restoration/
