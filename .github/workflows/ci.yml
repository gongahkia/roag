name: build-and-test
on: [push, pull_request]
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux graphics dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libglfw3-dev libgl1-mesa-dri xvfb xauth libxtst6
      - run: python scripts/bootstrap.py
      - run: python scripts/build.py check
      - run: python scripts/build.py test
      - run: python scripts/build.py build
      - name: Linux graphical smoke checks
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a python scripts/smoke.py --skip-build
