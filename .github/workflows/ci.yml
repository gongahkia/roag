name: Validate

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: SKIP_CAMPAIGN_MATRIX=1 npm run test:ci
      - run: npm run test:new-game-plus:full
      - run: npm run test:new-game-plus:lifecycle:full
      - run: npm run build
      - run: npm run test:e2e
