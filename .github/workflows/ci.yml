name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    env:
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v8.3.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install
        run: uv sync --frozen --extra dev
      - name: Unit tests
        run: uv run --frozen --extra dev python -m unittest discover -s tests
      - name: Compile
        run: uv run --frozen --extra dev python -m compileall -q src tests
      - name: Ruff
        run: uv run --frozen --extra dev ruff check .

  test-ml:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.3.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install
        run: uv sync --frozen --extra dev-ml
      - name: Unit tests
        run: uv run --frozen --extra dev-ml python -m unittest discover -s tests
      - name: Compile
        run: uv run --frozen --extra dev-ml python -m compileall -q src tests
      - name: Ruff
        run: uv run --frozen --extra dev-ml ruff check .

  pre-commit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.3.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install
        run: uv sync --frozen --extra dev
      - name: Run pre-commit
        run: uv run --frozen --extra dev pre-commit run --all-files

  coverage:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.3.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install
        run: uv sync --frozen --extra dev-ml
      - name: Run coverage
        run: uv run --frozen --extra dev-ml coverage run -m unittest discover -s tests
      - name: Write coverage reports
        run: |
          uv run --frozen --extra dev-ml coverage xml -o coverage.xml
          uv run --frozen --extra dev-ml coverage json -o coverage-current.json
          uv run --frozen --extra dev-ml coverage report
      - name: Compare coverage with main
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --depth=1
          git worktree add ../kenjaku-main origin/main
          cd ../kenjaku-main
          if [ -f uv.lock ]; then
            uv sync --frozen --extra dev-ml
            PYTHONPATH=src uv run --frozen --extra dev-ml coverage run --data-file=.coverage.base -m unittest discover -s tests
            uv run --frozen --extra dev-ml coverage json --data-file=.coverage.base -o coverage-base.json
          else
            python -m pip install -e ".[dev-ml]"
            PYTHONPATH=src python -m coverage run --data-file=.coverage.base -m unittest discover -s tests
            python -m coverage json --data-file=.coverage.base -o coverage-base.json
          fi
          cd -
          uv run --frozen --extra dev-ml python - <<'PY'
          import json
          import sys
          from pathlib import Path

          current = json.loads(Path("coverage-current.json").read_text(encoding="utf-8"))
          baseline = json.loads(
              Path("../kenjaku-main/coverage-base.json").read_text(encoding="utf-8")
          )
          current_percent = float(current["totals"]["percent_covered"])
          baseline_percent = float(baseline["totals"]["percent_covered"])
          drop = baseline_percent - current_percent
          print(f"main coverage: {baseline_percent:.2f}%")
          print(f"current coverage: {current_percent:.2f}%")
          print(f"coverage drop: {drop:.2f} percentage points")
          if drop > 2.0:
              print("coverage dropped by more than 2 percentage points")
              sys.exit(1)
          PY
      - uses: codecov/codecov-action@v7
        if: github.event_name == 'pull_request'
        with:
          files: coverage.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
