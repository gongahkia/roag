name: Colony web
on:
  push:
    paths: ['web/**', 'assets/**', 'docs/colony-web/**', 'tools/verify_preservation.py', 'tests/catalog/**', '.github/workflows/colony-web.yml']
  pull_request:
    paths: ['web/**', 'assets/**', 'docs/colony-web/**', 'tools/verify_preservation.py', 'tests/catalog/**', '.github/workflows/colony-web.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROAG_EVIDENCE_DIR: ../artifacts/colony-web/P05
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify preserved originals before build
        run: python3 -B ../tools/verify_preservation.py
      - run: npm ci
      - run: npm run assets
      - run: npm run assets:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:scenarios
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Both production base paths and real browser input
        run: npm run test:browser
      - name: Verify preserved originals after build
        run: python3 -B ../tools/verify_preservation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colony-web-P05
          path: artifacts/colony-web/P05/
          retention-days: 14
