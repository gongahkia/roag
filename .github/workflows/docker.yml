name: Docker

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/gongahkia/kenjaku

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        run: python3 scripts/validate_release_version.py "${GITHUB_REF_NAME}"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Verify published image
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools inspect "${IMAGE_NAME}:${version}" > image-manifest.txt
          grep -q "linux/amd64" image-manifest.txt
          grep -q "linux/arm64" image-manifest.txt
          docker pull "${IMAGE_NAME}:${version}"
          docker pull "${IMAGE_NAME}:latest"
          version_output=$(docker run --rm "${IMAGE_NAME}:${version}")
          latest_output=$(docker run --rm "${IMAGE_NAME}:latest")
          test "${version_output}" = "kenjaku ${version}"
          test "${latest_output}" = "kenjaku ${version}"
